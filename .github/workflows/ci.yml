name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: gdlint + gdformat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: gdformat (check only)
        run: gdformat --check .

      - name: gdlint
        run: gdlint .
